AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - stg
      - prd
  CategoryName:
    Type: String
  AppName:
    Type: String
  MonthlyBedrockBudgetUsd:
    Type: Number
    Default: 10
    Description: Bedrock の月額上限 (USD)。到達すると Lambda ロールに Bedrock 拒否ポリシーが自動付与される
  BudgetAlertEmail:
    Type: String
    Default: ''
    Description: 予算アラートの通知先メールアドレス（空なら SNS トピックのみ作成）

Conditions:
  HasBudgetAlertEmail: !Not [!Equals [!Ref BudgetAlertEmail, '']]

Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Runtime: python3.13
    Architectures:
      - arm64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        ITEM_TABLE_NAME: !Sub '${Environment}-app-item-table'
        CATEGORY_TABLE_NAME: !Sub '${Environment}-app-category-table'
        CUSTOMER_TABLE_NAME: !Sub '${Environment}-app-customers-table'
        BEDROCK_REGION: !Ref AWS::Region
        BEDROCK_MODEL_ID: global.anthropic.claude-haiku-4-5-20251001-v1:0

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-${CategoryName}-${AppName}-item-register-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-app-item-table'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-app-category-table'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-app-customers-table'
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # global. 推論プロファイルは他リージョンへルーティングされるため foundation-model はリージョンを限定しない
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*.anthropic.claude-*'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'

  Function:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt FunctionRole.Arn
      CodeUri: src/
      Handler: app.lambda_function.lambda_handler
      Layers:
        - arn:aws:lambda:ap-northeast-1:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-arm64:15
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: item-register
          POWERTOOLS_LOG_LEVEL: INFO
      Events:
        ItemRegister:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/item/regist
            Method: POST
        ItemList:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/item/list
            Method: GET
        ItemUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/item/update
            Method: PUT
        ItemDelete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/item/delete
            Method: DELETE
        ItemAnalyzeReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/item/analyze-receipt
            Method: POST
        CategoryRegister:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/category/regist
            Method: POST
        CategoryList:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/category/list
            Method: GET
        CategoryDelete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/category/delete
            Method: DELETE
        CategoryUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/category/update
            Method: PUT
        CategoryReorder:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/category/reorder
            Method: PUT
        BudgetRegister:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/customer/budget/regist
            Method: POST
        BudgetGet:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /api/v1/customer/budget
            Method: GET

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 90

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${Environment}-${CategoryName}-${AppName}-api'
      StageName: v1
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET, POST, PUT, DELETE, OPTIONS'"
        AllowHeaders: "'Content-Type'"

  # ------------------------------------------------------------------------------------------------
  # Bedrock コスト上限（AWS Budgets）
  #   80% 到達: SNS 通知 / 100% 到達: Lambda ロールに Bedrock 拒否ポリシーを自動付与して呼び出しを止める
  #   ※ 予算の集計はアカウント全体の Bedrock 利用額。反映には最大 8〜12 時間の遅延がある
  # ------------------------------------------------------------------------------------------------
  BedrockBudgetAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Environment}-${CategoryName}-${AppName}-bedrock-budget-alert'

  BedrockBudgetAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BedrockBudgetAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BedrockBudgetAlertTopic

  BedrockBudgetAlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasBudgetAlertEmail
    Properties:
      TopicArn: !Ref BedrockBudgetAlertTopic
      Protocol: email
      Endpoint: !Ref BudgetAlertEmail

  BedrockDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Environment}-${CategoryName}-${AppName}-bedrock-deny'
      Description: 予算超過時に Budgets Action が Lambda ロールへ付与する Bedrock 拒否ポリシー
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: '*'

  BudgetsActionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-${CategoryName}-${AppName}-budgets-action-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AttachDenyPolicyToFunctionRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:GetRole
                  - iam:GetPolicy
                Resource:
                  - !GetAtt FunctionRole.Arn
                  - !Ref BedrockDenyPolicy

  BedrockBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${Environment}-${CategoryName}-${AppName}-bedrock-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBedrockBudgetUsd
          Unit: USD
        CostFilters:
          Service:
            - Amazon Bedrock
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BedrockBudgetAlertTopic

  BedrockBudgetStopAction:
    Type: AWS::Budgets::BudgetsAction
    Properties:
      BudgetName: !Ref BedrockBudget
      ActionType: APPLY_IAM_POLICY
      NotificationType: ACTUAL
      ActionThreshold:
        Type: PERCENTAGE
        Value: 100
      ApprovalModel: AUTOMATIC
      ExecutionRoleArn: !GetAtt BudgetsActionRole.Arn
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref BedrockDenyPolicy
          Roles:
            - !Ref FunctionRole
      Subscribers:
        - Type: SNS
          Address: !Ref BedrockBudgetAlertTopic

Outputs:
  BedrockBudgetAlertTopicArn:
    Description: Bedrock 予算アラートの SNS トピック
    Value: !Ref BedrockBudgetAlertTopic
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
